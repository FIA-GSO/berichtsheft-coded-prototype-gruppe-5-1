<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8" />
    <title>Berichtsheft Eintrag</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link type="text/css" rel="stylesheet" href="style.css">
</head>
<body class="bg-white">

<nav class="navbar navbar-expand-md bg-white border-bottom">
    <div class="container-fluid px-4">
        <div class="d-flex align-items-center">
        </div>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#topNav" aria-controls="topNav"
                aria-expanded="false" aria-label="Menü umschalten">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse justify-content-end" id="topNav">
            <ul class="navbar-nav mb-2 mb-md-0 align-items-center">
                <li class="nav-item me-md-3 mt-2 mt-md-0">
                    <div class="position-relative">
                        <span class="fs-5">&#9993;</span>
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-warning text-dark">1</span>
                    </div>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="dashboard.html">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Settings</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container-fluid px-4 py-4">

    <div class="row justify-content-center">
        <div class="col-12 col-md-8 text-center">
            <h1 class="fw-bold">Berichtsheft Eintrag</h1>
        </div>
    </div>

    <div class="row justify-content-center mt-3">
        <div class="col-12 col-md-8 text-center">
            <h5>Mo. - 17. November 2025</h5>
        </div>
    </div>

    <div class="row justify-content-center mt-4">
        <div class="col-12 col-md-10 col-lg-8">

            <div class="table-responsive">
                <table class="table mb-0">
                    <thead class="table-secondary">
                    <tr>
                        <th class="text-center w-75">Tätigkeit</th>
                        <th class="text-center">Zeit</th>
                        <th class="text-center" style="width:60px;"></th>
                    </tr>
                    </thead>
                    <tbody id="activityBody">
                    <tr>
                        <td>
                            <textarea class="form-control autogrow" rows="1" placeholder="Inhalt eingeben" style="resize:none; height:40px; overflow:hidden" required>Aufgaben erledigt. Das Übliche.</textarea>
                        </td>
                        <td>
                            <input type="time" class="form-control">
                        </td>
                        <td class="text-center">
                            <button type="button" class="btn btn-sm delete-row">🗑️</button>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <textarea class="form-control autogrow" rows="1" placeholder="Inhalt eingeben" style="resize:none; height:40px; overflow:hidden" required>Aufgaben erledigt. Bla bla bla bla bla bla bla bla.</textarea>
                        </td>
                        <td>
                            <input type="time" class="form-control">
                        </td>
                        <td class="text-center">
                            <button type="button" class="btn btn-sm delete-row">🗑️</button>
                        </td>
                    </tr>
                    </tbody>
                    <tfoot>
                    <tr>
                        <td class="fst-italic fs-6 text-center" colspan="1">
                            Neue Tätigkeit hinzufügen
                        </td>
                        <td colspan="1" class="text-start">
                        </td>
                        <td class="text-end">
                            <button id="addRow" type="button" class="btn btn-link text-decoration-none">
                                <span class="me-1"></span>
                                <img src="plus.png" width="20px" height="20px">
                            </button>
                        </td>
                    </tr>
                    </tfoot>
                </table>
            </div>

            <div class="d-flex flex-column flex-md-row justify-content-end mt-4 gap-3">
                <button type="button" class="btn btn-primary rounded-pill px-4">&#10060; Abbrechen</button>
                <button type="button" class="btn btn-primary rounded-pill px-4">&#9989; Bestätigen</button>
            </div>
        </div>
    </div>
</div>

<footer class="fixed-bottom text-center py-3 border-top footer">
    <div class="container">
        <span class="text-muted">Footer</span>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // autogrow Funktion
    function enableAutogrow(textarea) {
        textarea.addEventListener('input', () => {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        });

        // initiale Höhe
        textarea.style.height = 'auto';
        textarea.style.height = textarea.scrollHeight + 'px';
    }

    // felder beim Laden aktivieren
    document.querySelectorAll('.autogrow').forEach(enableAutogrow);

    // neue Zeile hinzufügen
    document.getElementById('addRow').addEventListener('click', function () {
        const tbody = document.getElementById('activityBody');
        const tr = document.createElement('tr');

        tr.innerHTML = `
      <td>
        <textarea class="form-control autogrow" rows="1" placeholder="Inhalt eingeben" style="resize:none; height:40px; overflow:hidden" required></textarea>
    </td>
    <td>
        <input type="time" class="form-control">
    </td>
    <td class="text-center">
        <button type="button" class="btn btn-sm delete-row">🗑️</button>
    </td>
    `;

        tbody.appendChild(tr);

        // vergrößern bei den neuen Textareas aktivieren
        tr.querySelectorAll('.autogrow').forEach(enableAutogrow);
    });

    // zeile löschen
    document.getElementById('activityBody').addEventListener('click', function (e) {
        if (e.target.closest('.delete-row')) {
            e.target.closest('tr').remove();
        }
    });
</script>

</body>
</html>
